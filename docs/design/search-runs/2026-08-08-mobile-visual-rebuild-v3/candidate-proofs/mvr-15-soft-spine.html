<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>软书四六级 · 学习</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;

      --brand-ink: #0a1e4d;
      --brand-locator: #587000;
      --brand-locator-bright: #b7df16;
      --chrome-bg: #f4f8ff;
      --surface: #fbfcff;
      --on-strong: #fdfefe;
      --surface-soft: #edf3fc;
      --text: #0a1e4d;
      --text-muted: #465775;
      --border: #6e8fcb;
      --border-strong: #557bbe;

      --tone-a: #073fad;
      --tone-a-deep: #032b82;
      --tone-a-soft: #e6efff;
      --tone-b: #a70f50;
      --tone-b-deep: #7f0d3e;
      --tone-b-soft: #fff0f6;

      --confident: #22c58b;
      --confident-ink: #073b29;
      --review: #f5b100;
      --review-ink: #4b3200;
      --success: #11643a;
      --success-bg: #e5f6eb;
      --review-bg: #fff0c7;
      --error: #b3261e;
      --error-bg: #fff1f0;

      --shadow: 0 24px 70px rgba(10, 30, 77, .14);
      --radius-control: 8px;
      --radius-surface: 12px;
      --radius-object: 20px;
      --radius-pill: 999px;
      --radius-spine: 12px 20px 20px 12px;
      --type-scale: 1;
    }

    html { background: #e9eef7; }
    body {
      margin: 0;
      min-width: 280px;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 7% 3%, rgba(183, 223, 22, .16), transparent 23rem),
        linear-gradient(180deg, #edf3fb 0, #e5ebf5 100%);
      color: var(--text);
    }

    button, input, select, summary { font: inherit; }
    button { touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
      outline: 2px solid var(--surface);
      outline-offset: 2px;
      box-shadow: 0 0 0 5px var(--brand-ink);
    }

    .device {
      position: relative;
      width: var(--device-width, 393px);
      height: var(--device-height, 852px);
      max-width: 100%;
      overflow: hidden;
      container-type: size;
      border: 2px solid var(--on-strong);
      border-radius: 28px;
      background: var(--chrome-bg);
      box-shadow: var(--shadow), inset 0 0 0 1px rgba(85, 123, 190, .22);
      isolation: isolate;
    }
    .device[data-platform="android"] { border-radius: 16px; }
    .device--interactive { margin-inline: auto; transition: width .22s ease, height .22s ease; }
    .device--tablet { border-radius: 20px; }
    .device-note {
      margin: 11px 0 0;
      max-width: var(--device-width, 393px);
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.55;
    }

    .app-shell {
      --library: var(--tone-a);
      --library-deep: var(--tone-a-deep);
      --library-soft: var(--tone-a-soft);
      width: 100%;
      height: 100%;
      position: relative;
      min-width: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      overflow: hidden;
      color: var(--text);
      background:
        radial-gradient(circle at 80% 8%, color-mix(in srgb, var(--library) 8%, transparent), transparent 31%),
        var(--chrome-bg);
      font-size: calc(16px * var(--type-scale));
      line-height: 1.45;
    }
    .app-shell .device-note { font-size: calc(13px * var(--type-scale)); }
    .app-shell[data-tone="tone-b"] {
      --library: var(--tone-b);
      --library-deep: var(--tone-b-deep);
      --library-soft: var(--tone-b-soft);
    }
    .app-shell[data-tone="brand"] {
      --library: var(--brand-ink);
      --library-deep: #07183c;
      --library-soft: var(--surface-soft);
    }
    .system-bar {
      min-height: 34px;
      display: flex;
      align-items: end;
      justify-content: space-between;
      padding: 8px 18px 3px;
      color: var(--brand-ink);
      font-size: calc(13px * var(--type-scale));
      font-weight: 820;
      font-variant-numeric: tabular-nums;
    }
    .system-glyphs { display: flex; align-items: center; gap: 5px; }
    .signal-bars { display: inline-flex; align-items: end; gap: 2px; height: 12px; }
    .signal-bars i { width: 3px; border-radius: 1px 1px 0 0; background: currentColor; }
    .signal-bars i:nth-child(1) { height: 4px; }
    .signal-bars i:nth-child(2) { height: 6px; }
    .signal-bars i:nth-child(3) { height: 9px; }
    .signal-bars i:nth-child(4) { height: 12px; }
    .battery { width: 20px; height: 10px; padding: 1px; border: 1.5px solid currentColor; border-radius: 2px; }
    .battery::before { content: ""; display: block; width: 80%; height: 100%; background: currentColor; }

    .brand-bar {
      min-width: 0;
      min-height: 64px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 8px 18px 10px;
      background: rgba(244, 248, 255, .84);
    }
    .brand-lockup { display: flex; align-items: center; gap: 9px; margin-right: auto; color: var(--brand-ink); }
    .brand-lockup strong { font-size: calc(18px * var(--type-scale)); letter-spacing: -.04em; }
    .brand-symbol { width: 30px; height: 34px; flex: 0 0 auto; overflow: visible; }
    .brand-symbol path { fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linejoin: round; }
    .brand-symbol circle { fill: var(--brand-locator-bright); stroke: var(--brand-ink); stroke-width: 1.4; }
    .library-chip {
      min-height: 30px;
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: var(--radius-control);
      background: var(--library);
      color: var(--on-strong);
      font-size: calc(13px * var(--type-scale));
      font-weight: 820;
    }
    .progress-count {
      color: var(--text);
      font-size: calc(13px * var(--type-scale));
      font-weight: 760;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .progress-count b { color: var(--brand-locator); font-size: 1.25em; }

    .app-content {
      min-height: 0;
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
      padding: 0 16px 18px;
    }
    .screen { display: none; min-width: 0; }
    .app-shell[data-screen="learning"] .screen-learning,
    .app-shell[data-screen="result"] .screen-result,
    .app-shell[data-screen="space"] .screen-space,
    .app-shell[data-screen="audio"] .screen-audio,
    .app-shell[data-screen="stats"] .screen-stats,
    .app-shell[data-screen="profile"] .screen-profile,
    .app-shell[data-screen="auth"] .screen-auth,
    .app-shell[data-screen="lock"] .screen-lock,
    .app-shell[data-screen="elimination"] .screen-elimination,
    .app-shell[data-screen="swipe"] .screen-swipe { display: block; }
    .app-shell[data-screen="auth"] { grid-template-rows: auto minmax(0, 1fr); }
    .app-shell[data-screen="auth"] .brand-bar,
    .app-shell[data-screen="auth"] .app-nav { display: none; }
    .app-shell[data-screen="stats"] .progress-count,
    .app-shell[data-screen="profile"] .progress-count { display: none; }

    .location-strip {
      min-width: 0;
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 13px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-control);
      background: rgba(255, 255, 255, .82);
      color: var(--text);
      font-size: calc(13px * var(--type-scale));
      font-weight: 730;
    }
    .location-strip__path { min-width: 0; display: flex; align-items: center; flex-wrap: wrap; gap: 5px; }
    .location-strip__path i { color: var(--border-strong); font-style: normal; }
    .location-strip button {
      min-width: 44px;
      min-height: 44px;
      margin: -8px -12px -8px 0;
      padding: 7px 10px;
      border: 0;
      background: transparent;
      color: var(--library);
      font-size: inherit;
      font-weight: 820;
      cursor: pointer;
    }

    .soft-spine-wrap { position: relative; min-width: 0; padding-right: 14px; }
    .soft-spine-wrap::before,
    .soft-spine-wrap::after {
      content: "";
      position: absolute;
      inset: 8px 4px 8px 18px;
      z-index: 0;
      border: 1px solid var(--border);
      border-radius: var(--radius-spine);
      background: var(--surface);
      transform: translateX(4px);
    }
    .soft-spine-wrap::after { transform: translateX(9px); opacity: .72; }
    .knowledge-pin {
      position: absolute;
      right: 0;
      top: 46%;
      z-index: 4;
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 3px solid var(--brand-ink);
      border-radius: 50%;
      background: var(--surface);
      box-shadow: 0 0 0 2px var(--surface);
    }
    .knowledge-pin::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--brand-locator-bright); }

    .learning-card,
    .sound-card {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding: 23px 18px 20px;
      border-radius: var(--radius-spine);
      background: linear-gradient(145deg, var(--library) 0%, var(--library-deep) 100%);
      color: var(--on-strong);
      box-shadow: 0 14px 34px color-mix(in srgb, var(--library) 24%, transparent);
      clip-path: polygon(0 0, 92% 0, 100% 8%, 100% 92%, 92% 100%, 0 100%);
    }
    .learning-card { min-height: 430px; }
    .card-kicker {
      margin: 0 0 12px;
      color: #e4ecff;
      font-size: calc(13px * var(--type-scale));
      font-weight: 740;
      letter-spacing: .02em;
    }
    .app-shell[data-tone="tone-b"] .card-kicker { color: #ffe2ee; }
    .support-context {
      margin: 14px 0 0;
      padding: 10px 12px;
      border-left: 3px solid rgba(255, 255, 255, .82);
      background: rgba(255, 255, 255, .08);
      color: var(--on-strong);
      font-size: calc(13px * var(--type-scale));
      line-height: 1.55;
    }
    .learning-card h2,
    .sound-card h2 {
      margin: 0 0 16px;
      font-size: calc(24px * var(--type-scale));
      line-height: 1.25;
      letter-spacing: -.035em;
      overflow-wrap: anywhere;
    }

    .audio-control {
      min-width: 0;
      min-height: 68px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: var(--radius-surface);
      background: rgba(0, 18, 76, .16);
      color: var(--on-strong);
      text-align: left;
      cursor: pointer;
    }
    .audio-control__button {
      width: 46px;
      min-width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--surface);
      color: var(--library);
      font-size: calc(18px * var(--type-scale));
      font-weight: 900;
    }
    .audio-control__body { min-width: 0; }
    .waveform { height: 20px; display: flex; align-items: center; gap: 2px; overflow: hidden; }
    .waveform i { width: 3px; min-width: 2px; border-radius: 2px; background: currentColor; }
    .waveform i:nth-child(4n+1) { height: 7px; }
    .waveform i:nth-child(4n+2) { height: 15px; }
    .waveform i:nth-child(4n+3) { height: 20px; }
    .waveform i:nth-child(4n) { height: 11px; }
    .audio-control__meta {
      margin-top: 3px;
      font-size: calc(13px * var(--type-scale));
      font-variant-numeric: tabular-nums;
      white-space: normal;
    }
    .audio-state {
      max-width: 72px;
      color: var(--on-strong);
      font-size: calc(13px * var(--type-scale));
      font-weight: 780;
      text-align: right;
      overflow-wrap: anywhere;
    }
    .app-shell[data-audio="loading"] .waveform { opacity: .45; animation: pulse 1s ease-in-out infinite alternate; }
    .app-shell[data-audio="playing"] .waveform i { animation: wave .85s ease-in-out infinite alternate; }
    .app-shell[data-audio="error"] .audio-control { border-color: var(--on-strong); background: #7b1515; }
    .audio-control:disabled { cursor: wait; opacity: .82; }
    .flip-back-state { display: none; }
    .app-shell[data-flip="back"] .flip-front-state { display: none; }
    .app-shell[data-flip="back"] .flip-back-state { display: block; }
    .flip-answer {
      margin: 0 0 14px;
      padding: 13px;
      border-left: 4px solid rgba(255, 255, 255, .9);
      background: rgba(255, 255, 255, .10);
      color: var(--on-strong);
      font-size: calc(14px * var(--type-scale));
      font-weight: 780;
      line-height: 1.55;
    }
    .flip-analysis h2 { margin-bottom: 10px; font-size: calc(21px * var(--type-scale)); }
    .flip-analysis p { margin: 0 0 10px; color: var(--on-strong); font-size: calc(13px * var(--type-scale)); line-height: 1.55; }
    @keyframes pulse { to { opacity: 1; } }
    @keyframes wave { to { transform: scaleY(.45); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

    .option-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .option {
      min-width: 0;
      min-height: 74px;
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-content: start;
      gap: 9px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, .72);
      border-radius: var(--radius-control);
      background: rgba(255, 255, 255, .055);
      color: var(--on-strong);
      text-align: left;
      cursor: pointer;
    }
    .option:hover, .option[aria-pressed="true"] { background: rgba(255, 255, 255, .18); border-width: 2px; padding: 11px; }
    .option__key {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: calc(13px * var(--type-scale));
      font-weight: 850;
    }
    .option__text { min-width: 0; padding-top: 3px; font-size: calc(13px * var(--type-scale)); line-height: 1.4; overflow-wrap: anywhere; }

    .learning-grid { min-width: 0; }
    .session-context {
      margin-top: 12px;
      padding: 13px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-surface);
      background: var(--surface);
    }
    .session-context h3 { margin: 0 0 6px; font-size: calc(13px * var(--type-scale)); }
    .session-context p { margin: 0; color: var(--text-muted); font-size: calc(13px * var(--type-scale)); line-height: 1.55; }
    .context-meter { height: 7px; margin: 11px 0 7px; border-radius: var(--radius-pill); background: #dce5f6; overflow: hidden; }
    .context-meter i { display: block; width: 40%; height: 100%; background: var(--library); }
    .screen-learning .session-context {
      margin-top: 10px;
      padding: 0 2px;
      border: 0;
      background: transparent;
    }
    .screen-learning .session-context h3 { margin: 0; color: var(--text-muted); font-size: calc(13px * var(--type-scale)); font-weight: 720; }
    .screen-learning .session-context p,
    .screen-learning .session-context .context-meter { display: none; }
    .screen-result .session-context { display: none; }
    .primary-action,
    .secondary-action {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      padding: calc(10px * var(--type-scale)) 16px;
      border: 2px solid var(--library);
      border-radius: var(--radius-control);
      background: var(--library);
      color: var(--on-strong);
      font-size: calc(15px * var(--type-scale));
      font-weight: 820;
      cursor: pointer;
    }
    .secondary-action { background: var(--surface); color: var(--library); }
    .primary-action:disabled,
    .secondary-action:disabled {
      border-color: var(--border);
      background: var(--surface-soft);
      color: var(--text-muted);
      cursor: not-allowed;
      opacity: 1;
    }
    .evaluation-error {
      display: none;
      margin: 10px 0 0;
      padding: 10px 11px;
      border-left: 4px solid var(--error);
      background: var(--error-bg);
      color: var(--error);
      font-size: calc(13px * var(--type-scale));
      font-weight: 760;
      line-height: 1.5;
    }
    .app-shell[data-submit-state="error"] .screen-learning .evaluation-error { display: block; }

    .result-grid { min-width: 0; }
    .result-card {
      position: relative;
      min-width: 0;
      padding: 20px 19px;
      border: 1px solid var(--border);
      border-left: 7px solid var(--library);
      border-radius: var(--radius-surface);
      background: var(--surface);
      box-shadow: 8px 8px 0 var(--library-soft), 9px 9px 0 var(--border);
    }
    .result-status {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--border-strong);
      color: var(--success);
      font-size: calc(20px * var(--type-scale));
      font-weight: 860;
    }
    .result-status i {
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 50%;
      background: var(--success);
      color: var(--on-strong);
      font-style: normal;
    }
    .app-shell[data-result="wrong"] .result-status { color: var(--error); }
    .app-shell[data-result="wrong"] .result-status i { background: var(--error); }
    .picked-answer-section { display: none; }
    .app-shell[data-result="wrong"] .picked-answer-section { display: block; }
    .analysis-section { padding: 16px 0; border-bottom: 1px dashed var(--border-strong); }
    .analysis-section:last-child { border-bottom: 0; padding-bottom: 0; }
    .analysis-section h3 { margin: 0 0 8px; font-size: calc(13px * var(--type-scale)); }
    .analysis-section p { margin: 0; color: var(--text); font-size: calc(13px * var(--type-scale)); line-height: 1.65; overflow-wrap: anywhere; }
    .correct-answer {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr);
      align-items: start;
      gap: 10px;
      color: var(--text);
    }
    .correct-answer b {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--library);
      color: var(--on-strong);
    }
    .evidence-quote { padding-left: 15px; border-left: 4px solid var(--border-strong); }
    .result-context { margin-top: 14px; }
    .feedback-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .feedback-row button {
      min-height: 48px;
      padding: calc(8px * var(--type-scale)) 8px;
      border: 2px solid var(--confident-ink);
      border-radius: var(--radius-control);
      background: var(--confident);
      color: var(--confident-ink);
      font-size: calc(13px * var(--type-scale));
      font-weight: 830;
      cursor: pointer;
    }
    .feedback-row button:last-child { border-color: var(--review-ink); background: var(--review); color: var(--review-ink); }
    .feedback-row button:disabled { cursor: not-allowed; opacity: .76; }
    .assess-status {
      display: none;
      margin: 10px 0 0;
      padding: 9px 10px;
      border-left: 4px solid var(--border-strong);
      background: var(--surface-soft);
      color: var(--text);
      font-size: calc(13px * var(--type-scale));
      font-weight: 760;
      line-height: 1.5;
    }
    .app-shell[data-assess="pending"] .screen-audio .assess-status,
    .app-shell[data-assess="error"] .screen-audio .assess-status,
    .app-shell[data-assess="recorded"] .screen-audio .assess-status { display: block; }
    .app-shell[data-assess="error"] .screen-audio .assess-status { border-color: var(--error); background: var(--error-bg); color: var(--error); }
    .app-shell[data-assess="recorded"] .screen-audio .assess-status { border-color: var(--success); background: var(--success-bg); color: var(--success); }
    .assess-retry { display: none; }
    .app-shell[data-assess="error"] .screen-audio .assess-retry { display: block; }
    .flip-next { display: none; }
    .app-shell[data-assess="recorded"] .screen-audio .flip-next { display: block; }

    .space-title {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 2px 0 13px;
      font-size: calc(23px * var(--type-scale));
      letter-spacing: -.035em;
    }
    .space-title svg { width: 28px; height: 28px; color: var(--brand-ink); }
    .space-title svg,
    .hierarchy-label svg,
    .sleep-zone__head svg {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .space-canvas {
      min-width: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
    }
    .hierarchy-label {
      min-height: 44px;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 8px 10px;
      color: var(--text);
      font-size: calc(13px * var(--type-scale));
      font-weight: 800;
    }
    .hierarchy-label svg { width: 20px; height: 20px; color: var(--library); }
    .space-group {
      min-width: 0;
      margin-top: 0;
      padding: 0 0 0 10px;
      border: 0;
      border-left: 3px solid var(--library);
      border-radius: 0;
      background: transparent;
    }
    .box-area {
      min-width: 0;
      margin-top: 8px;
      padding: 10px;
      border: 2px solid var(--library);
      border-radius: var(--radius-surface);
      background: var(--surface);
    }
    .box-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

        window.requestAnimationFrame(() => { live.textContent = message; });

      function focusTarget(app, selector) {
        window.requestAnimationFrame(() => {
          const target = app.querySelector(selector);
          if (!target) return;
          if (!target.matches('button, input, select, textarea, a[href], [tabindex]')) target.setAttribute('tabindex', '-1');
          target.focus({ preventScroll: false });
        });
      }

      function focusScreenStart(app, screen) {
        const targets = {
          learning: '.screen-learning .choice-prompt',
          result: '.screen-result .result-status',
          space: '.screen-space .space-title',
          audio: '.screen-audio .card-kicker',
          lock: '.screen-lock .atlas-kicker',
          elimination: '.screen-elimination .atlas-kicker',
          swipe: '.screen-swipe .atlas-kicker',
          stats: '.screen-stats .brand-surface-header h2',
          profile: '.screen-profile .brand-surface-header h2',
          auth: '.screen-auth .auth-phone'
        };
        focusTarget(app, targets[screen] || '.app-content');
      }

      function showScreen(app, screen) {
        app.dataset.screen = screen;
        if (learningScreens.has(screen)) {
          app.dataset.lastLearning = screen;
          app.dataset.objectKind = objectForScreen(screen, app.dataset.objectKind);
        }
        syncChrome(app);
        const screenAnnouncement = screen === 'auth'
          ? '已打开手机号登录。'
          : `已进入${labels.route[screen] || screen}；${libraryFor(app)}。`;
        announce(app, screenAnnouncement);
        focusScreenStart(app, screen);
      }

      function goToCurrentLearning(app) {
        showScreen(app, learningScreens.has(app.dataset.lastLearning) ? app.dataset.lastLearning : 'learning');
      }

      function renderChoice(app) {
        const task = taskFor(app);
        app.querySelectorAll('.choice-prompt').forEach(node => node.textContent = task.prompt);
        app.querySelectorAll('.choice-support').forEach(node => node.textContent = task.support);
        app.querySelectorAll('.choice-context').forEach(node => node.textContent = task.context);
        app.querySelectorAll('.option').forEach((button, index) => {
          const option = task.options[index];
          button.dataset.choice = option[0];
          button.querySelector('.option__key').textContent = option[0];
          button.querySelector('.option__text').textContent = option[1];
          button.setAttribute('aria-pressed', String(app.dataset.pick === option[0]));
        });
        app.querySelectorAll('.answer-key').forEach(node => node.textContent = task.answer);
        app.querySelectorAll('.answer-text').forEach(node => node.textContent = optionText(task, task.answer));
        app.querySelectorAll('.analysis-title').forEach(node => node.textContent = task.analysis.title);
        app.querySelectorAll('.analysis-summary').forEach(node => node.textContent = task.analysis.summary);
        app.querySelectorAll('.analysis-tip').forEach(node => node.textContent = task.analysis.tip);
        syncChoiceControls(app);
      }

      function syncChoiceControls(app) {
        const pending = app.dataset.submitState === 'pending';
        const failed = app.dataset.submitState === 'error';
        const hasPick = Boolean(app.dataset.pick);
        app.querySelectorAll('.option').forEach(button => { button.disabled = pending; });
        app.querySelectorAll('[data-action="submit"]').forEach(button => {
          button.disabled = !hasPick || pending;
          button.setAttribute('aria-disabled', String(!hasPick || pending));
          button.setAttribute('aria-busy', String(pending));
          button.textContent = pending ? '正在判定…' : failed ? '重试判定' : '确认答案';
        });
      }

      function renderResult(app) {
        const task = taskFor(app);
        const pick = app.dataset.pick || task.answer;
        const correct = pick === task.answer;
        app.dataset.pick = pick;
        app.dataset.result = correct ? 'correct' : 'wrong';
        app.dataset.submitState = 'idle';
        app.dataset.objectKind = 'choice';
        app.dataset.lastLearning = 'result';
        app.dataset.screen = 'result';
        app.querySelectorAll('.result-mark').forEach(node => node.textContent = correct ? '✓' : '×');
        app.querySelectorAll('.result-label').forEach(node => node.textContent = correct ? '答对了' : '答错了');
        app.querySelectorAll('.picked-key').forEach(node => node.textContent = pick);
        app.querySelectorAll('.picked-text').forEach(node => node.textContent = optionText(task, pick));
        renderChoice(app);
        syncChrome(app);
        announce(app, `${correct ? '答对了' : '答错了'}，解析已展开。`);
        focusScreenStart(app, 'result');
      }

      function resetChoice(app, index = Number(app.dataset.taskIndex || 0)) {
        app.dataset.taskIndex = String(index);
        app.dataset.pick = '';
        app.dataset.result = 'none';
        app.dataset.submitState = 'idle';
        app.dataset.screen = 'learning';
        app.dataset.lastLearning = 'learning';
        app.dataset.objectKind = 'choice';
        resetAssessment(app);
        renderChoice(app);
        syncChrome(app);
      }

      function resetAssessment(app) {
        app.dataset.assess = 'idle';
        app.dataset.assessPick = '';
        app.dataset.flip = 'front';
        renderAssessment(app);
      }

      function renderAssessment(app) {
        const mode = app.dataset.assess;
        const pick = app.dataset.assessPick;
        app.querySelectorAll('[data-action="self-assess"]').forEach(node => {
          const selected = node.dataset.value === pick;
          node.disabled = mode !== 'idle';
          node.setAttribute('aria-pressed', String(selected));
          node.setAttribute('aria-busy', String(mode === 'pending' && selected));
          const label = node.dataset.value === 'confident' ? '有把握' : '再回看';
          node.textContent = selected && mode === 'recorded' ? `✓ ${label}` : selected && mode === 'pending' ? `… ${label}` : label;
        });
        const status = app.querySelector('.assess-status');
        if (status) {
          const label = pick === 'confident' ? '有把握' : '再回看';
          status.textContent = mode === 'pending'
            ? `正在保存“${label}”…`
            : mode === 'error'
              ? `“${label}”还没保存，请重试。`
              : mode === 'recorded'
                ? `已记下“${label}”，可以继续下一张。`
                : '';
        }
        app.querySelectorAll('[data-action="assess-retry"]').forEach(node => {
          node.disabled = mode === 'pending';
          node.setAttribute('aria-busy', String(mode === 'pending'));
        });
      }

      function beginAssessmentCommit(app, pick = app.dataset.assessPick) {
        if (!pick || app.dataset.assess === 'pending') return;
        app.dataset.assessPick = pick;
        app.dataset.assess = 'pending';
        renderAssessment(app);
        window.setTimeout(() => {
          if (app.dataset.assess !== 'pending') return;
          app.dataset.assess = 'recorded';
          renderAssessment(app);
          announce(app, '已记下掌握情况，可以继续下一张。');
          focusTarget(app, '.screen-audio .flip-next');
        }, 650);
      }

      function renderSpaceIdentity(app) {
        const kind = app.dataset.objectKind;
        let kicker;
        let prompt;
        let answer;
        if (kind === 'sound') {
          kicker = '听力判断';
          prompt = '短对话里听到 however，优先盯哪一半信息？';
          answer = app.dataset.flip === 'back'
            ? '优先盯转折后的半句，再回头核对前面让步或铺垫的信息。'
            : '仍在正面，返回后可继续听音频并翻面。';
        } else if (kind === 'lock') {
          kicker = '句子主干';
          prompt = '把句子主干锁出来，三个槽位都对才开锁。';
          answer = 'S · The policy　V · reduces　O · test anxiety';
        } else if (kind === 'elimination') {
          kicker = '保留句干';
          prompt = '点掉应删除的干扰成分，保留句干。';
          answer = '保留句干：The students remember the pattern.';
        } else if (kind === 'swipe') {
          kicker = '表达判断';
          prompt = 'be likely to do 在表达转换里更接近哪一侧？';
          answer = '可直接套用 · 表达“很可能做某事”。';
        } else {
          const task = taskFor(app);
          kicker = '词义辨析';
          prompt = task.prompt;
          answer = `${task.answer} · ${optionText(task, task.answer)}`;
        }
        app.querySelectorAll('.space-item-kicker').forEach(node => node.textContent = kicker);
        app.querySelectorAll('.space-item-prompt').forEach(node => node.textContent = prompt);
        app.querySelectorAll('.space-item-answer').forEach(node => node.textContent = answer);
        const returnLabels = { sound: '返回听力判断', lock: '返回句子主干', elimination: '返回保留句干', swipe: '返回表达判断' };
        const returnLabel = returnLabels[kind] || (app.dataset.returnScreen === 'result' ? '返回解析' : app.dataset.returnScreen === 'stats' ? '返回统计' : app.dataset.returnScreen === 'profile' ? '返回我的' : '返回学习');
        app.querySelectorAll('[data-action="back-learning"]').forEach(node => node.textContent = returnLabel);
        app.querySelectorAll('.space-library-name').forEach(node => node.textContent = libraryFor(app));
      }

      function renderFavorite(app) {
        app.dataset.favorite = state.favorite;
        app.dataset.favoriteOp = state.favoriteOp;
        app.dataset.favoriteTarget = state.favoriteTarget;
        app.dataset.motion = state.motion;
        const committed = state.favorite === 'on';
        const pending = state.favoriteOp === 'pending';
        const failed = state.favoriteOp === 'error';
        const targetOn = state.favoriteTarget === 'on';
        app.querySelectorAll('[data-action="favorite"]').forEach(button => {
          button.disabled = pending;
          button.setAttribute('aria-disabled', String(pending));
          button.setAttribute('aria-busy', String(pending));
          button.setAttribute('aria-pressed', String(committed));
          button.textContent = pending
            ? targetOn ? '正在收藏…' : '正在取消…'
            : failed
              ? targetOn ? '重试收藏' : '重试取消收藏'
              : committed ? '✓ 已收藏' : '收藏';
        });
        app.querySelectorAll('.favorite-state').forEach(node => {
          node.textContent = pending
            ? `${targetOn ? '正在收藏' : '正在取消收藏'}…`
            : failed
              ? '保存失败，请重试。'
              : committed
                ? '已加入收藏。'
                : '尚未收藏。';
        });
      }

      function beginFavoriteOperation(app, target = state.favorite === 'on' ? 'off' : 'on') {
        if (state.favoriteOp === 'pending') return;
        state.favoriteTarget = target;
        state.favoriteOp = 'pending';
        syncStates();
        window.setTimeout(() => {
          if (state.favoriteOp !== 'pending') return;
          state.favorite = state.favoriteTarget;
          state.favoriteOp = 'idle';
          syncStates();
          announce(app, state.favorite === 'on' ? '已加入收藏。' : '已取消收藏。');
          focusTarget(app, '.screen-space [data-action="favorite"]');
        }, 650);
      }

      function renderSleep(app) {
        app.dataset.sleep = state.sleep;
        app.dataset.sleepOp = state.sleepOp;
        const pending = state.sleepOp === 'sleep-pending' || state.sleepOp === 'wake-pending';
        const message = labels.sleepOp[state.sleepOp] || labels.sleep[state.sleep];
        app.querySelectorAll('.sleep-state').forEach(node => node.textContent = message);
        app.querySelectorAll('[data-action="sleep"]').forEach(button => {
          button.disabled = pending;
          button.setAttribute('aria-disabled', String(pending));
          button.setAttribute('aria-busy', String(state.sleepOp === 'sleep-pending'));
          button.textContent = state.sleepOp === 'sleep-pending'
            ? '正在移入…'
            : state.sleepOp === 'sleep-error'
              ? '重试移入睡眠区'
              : state.sleep === 'sleeping' ? '已在睡眠区' : '移入睡眠区';
        });
        app.querySelectorAll('[data-action="wake"]').forEach(button => {
          button.disabled = pending;
          button.setAttribute('aria-disabled', String(pending));
          button.setAttribute('aria-busy', String(state.sleepOp === 'wake-pending'));
          button.textContent = state.sleepOp === 'wake-pending'
            ? '正在唤醒…'
            : state.sleepOp === 'wake-error' ? '重试唤醒' : '唤醒卡片';
        });
      }

      function beginSleepOperation(app, kind) {
        if (state.sleepOp === 'sleep-pending' || state.sleepOp === 'wake-pending') return;
        state.sleepOp = kind === 'sleep' ? 'sleep-pending' : 'wake-pending';
        syncStates();
        window.setTimeout(() => {
          if (kind === 'sleep' && state.sleepOp !== 'sleep-pending') return;
          if (kind === 'wake' && state.sleepOp !== 'wake-pending') return;
          state.sleep = kind === 'sleep' ? 'sleeping' : 'active';
          state.sleepOp = 'idle';
          syncStates();
          announce(app, kind === 'sleep' ? '已移入睡眠区。' : '已唤醒，这张卡会再次出现在学习中。');
          focusTarget(app, kind === 'sleep' ? '.screen-space [data-action="wake"]' : '.screen-space [data-action="sleep"]');
        }, 650);
      }

      function enterSpace(app) {
        if (app.dataset.screen !== 'space') {
          app.dataset.spaceOrigin = app.dataset.screen;
          app.dataset.returnScreen = app.dataset.screen;
          app.dataset.objectKind = objectForScreen(app.dataset.screen, app.dataset.objectKind);
        }
        app.dataset.screen = 'space';
        renderSpaceIdentity(app);
        syncChrome(app);
        announce(app, `已进入空间；当前卡位于${libraryFor(app)}的当前盒。`);
        focusScreenStart(app, 'space');
      }

      function returnFromSpace(app) {
        showScreen(app, app.dataset.returnScreen || app.dataset.spaceOrigin || 'learning');
      }

      function renderStats(app) {
        const value = statsBook[app.dataset.stats] || statsBook.progress;
        app.querySelectorAll('.stats-ledger dd').forEach((node, index) => node.textContent = value.values[index]);
        app.querySelectorAll('.stats-summary').forEach(node => node.textContent = value.summary);
        app.querySelectorAll('[data-action="stats-next"]').forEach(node => node.textContent = value.action);
        app.querySelectorAll('.checkin-message').forEach(node => node.textContent = value.checkin);
        app.querySelectorAll('[data-action="checkin"]').forEach(button => {
          const pending = app.dataset.stats === 'checkin-pending';
          button.hidden = app.dataset.stats === 'empty' || app.dataset.stats === 'success';
          button.disabled = pending;
          button.setAttribute('aria-busy', String(pending));
          button.textContent = pending ? '正在收好…' : app.dataset.stats === 'failure' ? '重试签到' : '收好今天';
        });
      }

      function renderMembership(app) {
        const stage = app.dataset.membership;
        const content = {
          'trial-ready': ['试用尚未开始', '完成首次学习后开始试用，现在查看不会计时。'],
          'trial-active': ['试用进行中', '剩余时间会显示在会员权益中。'],
          free: ['免费计划', '基础学习保持可用；升级后可使用更多学习内容和功能。'],
          premium: ['会员已开放', '完整学习内容和会员功能已生效。'],
          error: ['免费计划', '暂时无法加载会员权益，请重试购买或恢复。']
        }[stage] || ['试用尚未开始', '完成首次学习后开始试用，现在查看不会计时。'];
        app.querySelectorAll('.membership-stage').forEach(node => node.textContent = content[0]);
        app.querySelectorAll('.membership-copy').forEach(node => node.textContent = content[1]);
        const pending = app.dataset.membershipOp !== 'idle';
        app.querySelectorAll('.membership-actions button').forEach(button => {
          button.disabled = pending;
          button.setAttribute('aria-busy', String(pending));
        });
        app.querySelectorAll('[data-action="purchase"]').forEach(button => button.textContent = app.dataset.membershipOp === 'purchase' ? '购买处理中…' : stage === 'error' ? '重试购买' : '购买会员');
        app.querySelectorAll('[data-action="restore"]').forEach(button => button.textContent = app.dataset.membershipOp === 'restore' ? '正在恢复…' : '恢复购买');
      }

      function setAuthState(app, next) {
        app.dataset.auth = next;
        renderAuth(app);
      }

      function clearAuthInputs(app) {
        app.querySelector('.auth-phone').value = '';
        app.querySelector('.auth-code').value = '';
      }

      function renderAuth(app) {
        const mode = app.dataset.auth;
        const phone = app.querySelector('.auth-phone');
        const code = app.querySelector('.auth-code');
        const primary = app.querySelector('[data-action="auth-primary"]');
        const secondary = app.querySelector('[data-action="auth-secondary"]');
        const live = app.querySelector('.auth-live');
        const phoneDigits = phone?.value.replace(/\D/g, '') || '';
        const phoneReady = mode === 'phone-valid' || /^1[3-9]\d{9}$/.test(phoneDigits);
        const codeReady = (code?.value.replace(/\D/g, '').length || 0) >= 4;
        const copy = {
          'phone-empty': '请输入 11 位手机号获取短码。',
          'phone-invalid': '手机号格式不正确；请检查 11 位号码后再发送。',
          'phone-valid': '手机号已填写，可以获取短码。',
          requesting: '正在发送短码…',
          'code-requested': '短码已发送；输入 4–6 位后完成登录。',
          'code-expired': '短码已过期，请重新发送。',
          resending: '正在重新发送短码…',
          'resend-cooldown': '短码已重新发送，45 秒后可再次发送。',
          verifying: '正在验证…',
          'request-error': '发送失败，请重试或修改手机号。',
          'request-network-error': '网络中断，请检查网络后重试。',
          'verify-error': '短码不正确，请修改后重试。',
          'verify-network-error': '网络中断，请检查网络后重试验证。',
          hydrating: '登录成功，正在恢复学习进度…',
          'hydration-error': '登录成功，但学习进度暂未恢复。',
          ready: '登录成功，学习进度已恢复。'
        }[mode] || '';
        live.textContent = copy;
        const busy = mode === 'requesting' || mode === 'resending' || mode === 'verifying' || mode === 'hydrating';
        let label = '获取短码';
        let disabled = !phoneReady;
        if (mode === 'phone-invalid') { label = '检查手机号'; disabled = true; }
        if (mode === 'requesting') { label = '正在发送…'; disabled = true; }
        if (mode === 'code-requested') { label = '完成登录'; disabled = !codeReady; }
        if (mode === 'code-expired') { label = '重新发送短码'; disabled = false; }
        if (mode === 'resending') { label = '正在重发…'; disabled = true; }
        if (mode === 'resend-cooldown') { label = '45 秒后可重发'; disabled = true; }
        if (mode === 'verifying') { label = '正在验证…'; disabled = true; }
        if (mode === 'request-error' || mode === 'request-network-error') { label = '重试发送'; disabled = false; }
        if (mode === 'verify-error') { label = '重新验证'; disabled = !codeReady; }
        if (mode === 'verify-network-error') { label = '重试验证'; disabled = !codeReady; }
        if (mode === 'hydrating') { label = '正在恢复…'; disabled = true; }
        if (mode === 'hydration-error') { label = '重试恢复'; disabled = false; }
        primary.textContent = label;
        primary.disabled = disabled;
        primary.setAttribute('aria-disabled', String(disabled));
        primary.setAttribute('aria-busy', String(busy));
        phone.disabled = busy || ['code-requested', 'code-expired', 'resend-cooldown', 'verify-error', 'verify-network-error', 'hydrating'].includes(mode);
        code.disabled = ['verifying', 'resending', 'resend-cooldown', 'code-expired'].includes(mode);
        secondary.textContent = mode === 'hydration-error' ? '退出当前账号' : '修改手机号';
        if (mode === 'phone-valid' && !phone.value) phone.placeholder = '号码格式已确认';
        else phone.placeholder = '输入 11 位手机号';
      }

      function syncLock(app) {
        const values = { subject: app.dataset.lockSubject, verb: app.dataset.lockVerb, object: app.dataset.lockObject };
        const complete = Object.values(values).every(Boolean);
        const allCorrect = Object.keys(lockAnswer).every(key => values[key] === lockAnswer[key]);
        const result = app.dataset.lockResult;
        app.querySelectorAll('[data-lock-select]').forEach(select => {
          const key = select.dataset.lockSelect;
          if (select.value !== values[key]) select.value = values[key] || '';
          const row = select.closest('.lock-row');
          row.dataset.rowState = result === 'idle' ? 'idle' : values[key] === lockAnswer[key] ? 'correct' : 'wrong';
        });
        const submit = app.querySelector('[data-action="lock-submit"]');
        submit.disabled = !complete;
        submit.setAttribute('aria-disabled', String(!complete));
        const status = app.querySelector('.screen-lock .atlas-status');
        status.textContent = result === 'correct'
          ? '主语、谓语和宾语都已确认。'
          : result === 'editing' && allCorrect
            ? '三个槽位已修正，请再次确认。'
            : '还有行保持锁定；正确行已经保留，请修改错误行。';
      }

      function syncElimination(app) {
        const picks = app.dataset.eliminationPicks ? app.dataset.eliminationPicks.split(',').filter(Boolean) : [];
        app.querySelectorAll('.elimination-fragment').forEach(button => {
          const key = button.dataset.fragment;
          const selected = picks.includes(key);
          button.setAttribute('aria-pressed', String(selected));
          button.removeAttribute('data-mark');
          if (app.dataset.eliminationResult === 'wrong') {
            if (selected && !eliminationAnswer.includes(key)) button.dataset.mark = 'your';
            else if (!selected && eliminationAnswer.includes(key)) button.dataset.mark = 'missed';
            else if (selected) button.dataset.mark = 'right';
          }
        });
        const submit = app.querySelector('[data-action="elimination-submit"]');
        submit.disabled = picks.length === 0;
        submit.setAttribute('aria-disabled', String(picks.length === 0));
        const status = app.querySelector('.screen-elimination .atlas-status');
        status.textContent = app.dataset.eliminationResult === 'correct' ? '剥离正确，句干已经清楚。' : '剥离结果需要调整：已同时标出你的选择和应剥离项。';
      }

      function syncSwipe(app) {
        const status = app.querySelector('.screen-swipe .atlas-status');
        status.textContent = app.dataset.swipeResult === 'correct' ? '判断正确：可直接套用。' : '判断错误：likely 表达概率，不是 like。';
        const card = app.querySelector('.swipe-card');
        const phase = app.dataset.swipePhase || 'idle';
        if (card) {
          const reduced = app.dataset.motion === 'reduced';
          const value = app.dataset.swipeResult === 'correct' || phase === 'preview-left' ? '-1' : app.dataset.swipeResult === 'wrong' || phase === 'preview-right' ? '1' : '0';
          const valueText = app.dataset.swipeResult === 'correct'
            ? '已提交：可直接套用'
            : app.dataset.swipeResult === 'wrong'
              ? '已提交：容易误用'
              : phase === 'preview-left'
                ? '预览：可直接套用；尚未提交'
                : phase === 'preview-right'
                  ? '预览：容易误用；尚未提交'
                  : '尚未选择；向左为可直接套用，向右为容易误用';
          card.tabIndex = reduced ? -1 : 0;
          card.setAttribute('aria-hidden', String(reduced));
          card.setAttribute('aria-valuenow', value);
          card.setAttribute('aria-valuetext', valueText);
        }
        const gesture = app.querySelector('.swipe-gesture-status');
        if (gesture) {
          gesture.textContent = app.dataset.motion === 'reduced'
            ? '动态效果已减少，请使用下方按钮作答。'
            : phase === 'preview-left'
              ? '松手选择“可直接套用”。'
              : phase === 'preview-right'
                ? '松手选择“容易误用”。'
                : phase === 'cancelled'
                  ? '没有选择，卡片已回到原位。'
                  : '左右滑动选择，也可以点击下方选项。';
        }
      }

      function cancelSwipe(app) {
        const card = app.querySelector('.swipe-card');
        if (card) card.style.transform = '';
        app.dataset.swipePhase = 'cancelled';
        syncSwipe(app);
        announce(app, '没有选择，卡片已回到原位。');
        window.setTimeout(() => {
          if (app.dataset.swipePhase !== 'cancelled') return;
          app.dataset.swipePhase = 'idle';
          syncSwipe(app);
        }, 500);
      }

      function commitSwipe(app, choice) {
        const card = app.querySelector('.swipe-card');
        if (card) card.style.transform = '';
        app.dataset.swipePhase = 'committed';
        app.dataset.swipeResult = choice === 'left' ? 'correct' : 'wrong';
        syncSwipe(app);
        announce(app, app.dataset.swipeResult === 'correct' ? '判断正确，解析已展开。' : '判断错误，解析已展开。');
        focusTarget(app, '.screen-swipe .atlas-next');
      }

      function mount(device) {
        device.append(template.content.cloneNode(true));
        const app = device.querySelector('.app-shell');
        const initialScreen = device.dataset.screen || 'learning';
        app.dataset.screen = initialScreen;
        app.dataset.lastLearning = learningScreens.has(initialScreen) ? initialScreen : 'learning';
        app.dataset.objectKind = objectForScreen(initialScreen, 'choice');
        if (device.dataset.authState) app.dataset.auth = device.dataset.authState;
        app.dataset.audio = state.audio;
        app.dataset.sleep = state.sleep;
        app.dataset.sleepOp = state.sleepOp;
        app.dataset.favorite = state.favorite;
        app.dataset.favoriteOp = state.favoriteOp;
        app.dataset.favoriteTarget = state.favoriteTarget;
        app.style.setProperty('--type-scale', state.font);
        if (device.dataset.platform === 'android') device.querySelector('.system-time').textContent = '3:42';
        renderChoice(app);
        if (initialScreen === 'result') {
          app.dataset.pick = taskFor(app).answer;
          renderResult(app);
        } else if (initialScreen === 'audio') {
          app.dataset.objectKind = 'sound';
          app.dataset.returnScreen = 'audio';
        } else if (initialScreen === 'space') {
          app.dataset.objectKind = 'choice';
          renderSpaceIdentity(app);
        }
        renderStats(app);
        renderMembership(app);
        renderAuth(app);
        renderAssessment(app);
        renderFavorite(app);
        renderSleep(app);
        syncLock(app);
        syncElimination(app);
        syncSwipe(app);
        syncChrome(app);
      }

      function syncChrome(app) {
        const screen = app.dataset.screen;
        const kind = screen === 'space' ? app.dataset.objectKind : objectForScreen(screen, app.dataset.objectKind);
        const isBrand = screen === 'stats' || screen === 'profile' || screen === 'auth';
        app.dataset.tone = isBrand ? 'brand' : (kind === 'sound' || kind === 'lock' || kind === 'elimination') ? 'tone-a' : 'tone-b';
        const library = libraryFor(app);
        app.querySelector('.library-chip').textContent = library;
        app.querySelectorAll('.location-library').forEach(node => node.textContent = library);
        if (screen === 'space') app.querySelectorAll('.space-library-name').forEach(node => node.textContent = library);
        const navButtons = [...app.querySelectorAll('.app-nav button')];
        navButtons.forEach(button => button.removeAttribute('aria-current'));
        const activeRoute = screen === 'space' ? 'space' : screen === 'stats' ? 'stats' : screen === 'profile' ? 'profile' : learningScreens.has(screen) ? 'learning' : '';
        const active = app.querySelector(`.app-nav button[data-route="${activeRoute}"]`);
        if (active) active.setAttribute('aria-current', 'page');
      }

      function syncStates() {
        document.querySelectorAll('.app-shell').forEach(app => {
          app.dataset.audio = state.audio;
          app.dataset.motion = state.motion;
          app.style.setProperty('--type-scale', state.font);
          app.querySelectorAll('.audio-state').forEach(node => node.textContent = labels.audio[state.audio]);
          app.querySelectorAll('.audio-control__meta').forEach(node => node.textContent = labels.audioTime[state.audio]);
          app.querySelectorAll('.audio-control__button').forEach(node => node.textContent = state.audio === 'playing' ? 'Ⅱ' : state.audio === 'loading' ? '…' : state.audio === 'error' ? '↻' : '▶');
          app.querySelectorAll('.audio-control').forEach(node => {
            node.disabled = state.audio === 'loading';
            node.setAttribute('aria-busy', String(state.audio === 'loading'));
            node.setAttribute('aria-pressed', String(state.audio === 'playing'));
            node.setAttribute('aria-label', labels.audioAction[state.audio]);
          });
          syncChoiceControls(app);
          renderStats(app);
          renderMembership(app);
          renderAuth(app);
          renderAssessment(app);
          renderFavorite(app);
          renderSleep(app);
          syncLock(app);
          syncElimination(app);
          syncSwipe(app);
          syncChrome(app);
        });
      }

      allDevices.forEach(mount);

      document.addEventListener('input', event => {
        const app = event.target.closest('.app-shell');
        if (!app) return;
        if (event.target.classList.contains('auth-phone')) {
          if (['phone-empty', 'phone-invalid', 'phone-valid'].includes(app.dataset.auth)) {
            const digits = event.target.value.replace(/\D/g, '');
            app.dataset.auth = digits.length === 11 ? (/^1[3-9]\d{9}$/.test(digits) ? 'phone-valid' : 'phone-invalid') : 'phone-empty';
          }
          renderAuth(app);
        }
        if (event.target.classList.contains('auth-code')) renderAuth(app);
      });

      document.addEventListener('change', event => {
        const select = event.target.closest('select[data-lock-select]');
        if (!select) return;
        const app = select.closest('.app-shell');
        const key = select.dataset.lockSelect;
        if (key === 'subject') app.dataset.lockSubject = select.value;
        if (key === 'verb') app.dataset.lockVerb = select.value;
        if (key === 'object') app.dataset.lockObject = select.value;
        if (app.dataset.lockResult !== 'idle') app.dataset.lockResult = 'editing';
        syncLock(app);
      });

      document.addEventListener('pointerdown', event => {
        const card = event.target.closest('.swipe-card');
        if (!card) return;
        const app = card.closest('.app-shell');
        if (!app || app.dataset.motion === 'reduced' || app.dataset.swipeResult !== 'idle') return;
        swipeDrags.set(card, { id: event.pointerId, startX: event.clientX, startY: event.clientY, dx: 0, dy: 0 });
        card.setPointerCapture?.(event.pointerId);
        card.style.transition = 'none';
        app.dataset.swipePhase = 'dragging';
        syncSwipe(app);
      });

      document.addEventListener('pointermove', event => {
        const card = event.target.closest('.swipe-card');
        const drag = card ? swipeDrags.get(card) : null;
        if (!card || !drag || drag.id !== event.pointerId) return;
        const app = card.closest('.app-shell');
        drag.dx = event.clientX - drag.startX;
        drag.dy = event.clientY - drag.startY;
        if (Math.abs(drag.dy) > Math.abs(drag.dx) + 12) {
          card.style.transform = '';
          app.dataset.swipePhase = 'dragging';
        } else {
          const travel = Math.max(-112, Math.min(112, drag.dx));
          card.style.transform = `translateX(${travel}px) rotate(${travel / 34}deg)`;
          app.dataset.swipePhase = Math.abs(drag.dx) < 24 ? 'dragging' : drag.dx < 0 ? 'preview-left' : 'preview-right';
        }
        syncSwipe(app);
      });

      function finishSwipePointer(event, forcedCancel = false) {
        const card = event.target.closest('.swipe-card');
        const drag = card ? swipeDrags.get(card) : null;
        if (!card || !drag || drag.id !== event.pointerId) return;
        const app = card.closest('.app-shell');
        swipeDrags.delete(card);
        card.releasePointerCapture?.(event.pointerId);
        card.style.transition = '';
        const verticalIntent = Math.abs(drag.dy) > Math.abs(drag.dx) + 12;
        if (forcedCancel || verticalIntent || Math.abs(drag.dx) < 72) cancelSwipe(app);
        else commitSwipe(app, drag.dx < 0 ? 'left' : 'right');
      }

      document.addEventListener('pointerup', event => finishSwipePointer(event));
      document.addEventListener('pointercancel', event => finishSwipePointer(event, true));

      document.addEventListener('keydown', event => {
        const card = event.target.closest('.swipe-card');
        if (!card) return;
        const app = card.closest('.app-shell');
        if (!app || app.dataset.motion === 'reduced' || app.dataset.swipeResult !== 'idle') return;
        if (event.key === 'ArrowLeft' || event.key === 'ArrowRight') {
          event.preventDefault();
          app.dataset.swipePhase = event.key === 'ArrowLeft' ? 'preview-left' : 'preview-right';
          syncSwipe(app);
            announce(app, event.key === 'ArrowLeft' ? '可直接套用。' : '容易误用。');
        }
        if (event.key === 'Escape') {
          event.preventDefault();
          cancelSwipe(app);
        }
        if (event.key === 'Enter' && (app.dataset.swipePhase === 'preview-left' || app.dataset.swipePhase === 'preview-right')) {
          event.preventDefault();
          commitSwipe(app, app.dataset.swipePhase === 'preview-left' ? 'left' : 'right');
        }
      });

      document.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        const app = button.closest('.app-shell');
        if (!app) return;
        if (button.classList.contains('option')) {
          if (app.dataset.submitState === 'pending') return;
          app.dataset.pick = button.dataset.choice;
          app.querySelectorAll('.option').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
          syncChoiceControls(app);
          return;
        }
        if (button.dataset.action === 'audio') {
          if (state.audio === 'loading') return;
          const wasError = state.audio === 'error';
          state.audio = state.audio === 'playing' ? 'paused' : wasError ? 'loading' : 'playing';
          syncStates();
          if (wasError) {
            window.setTimeout(() => {
              if (state.audio !== 'loading') return;
              state.audio = 'playing';
              syncStates();
            }, 650);
          }
        }
        if (button.dataset.action === 'flip') { app.dataset.flip = 'back'; }
        if (button.dataset.action === 'self-assess') {
          beginAssessmentCommit(app, button.dataset.value);
        }
        if (button.dataset.action === 'assess-retry') beginAssessmentCommit(app);
        if (button.dataset.action === 'flip-next') resetChoice(app, (Number(app.dataset.taskIndex || 0) + 1) % choiceDeck.length);
        if (button.dataset.action === 'submit') {
          if (!app.dataset.pick || app.dataset.submitState === 'pending') return;
          app.dataset.submitState = 'pending';
          syncChoiceControls(app);
          window.setTimeout(() => {
            if (app.dataset.submitState !== 'pending') return;
            renderResult(app);
          }, 650);
        }
        if (button.dataset.action === 'show-space') enterSpace(app);
        if (button.dataset.action === 'back-learning') returnFromSpace(app);
        if (button.dataset.action === 'next') resetChoice(app, (Number(app.dataset.taskIndex || 0) + 1) % choiceDeck.length);
        if (button.dataset.route === 'space') enterSpace(app);
        if (button.dataset.route === 'learning') {
          goToCurrentLearning(app);
        }
        if (button.dataset.route === 'stats') showScreen(app, 'stats');
        if (button.dataset.route === 'profile') showScreen(app, 'profile');
        if (button.dataset.action === 'stats-next') {
          if (app.dataset.stats === 'empty') {
            resetChoice(app, 0);
          } else if (app.dataset.stats === 'review') {
            app.dataset.flip = 'front';
            app.dataset.assess = 'idle';
            showScreen(app, 'audio');
          } else {
            goToCurrentLearning(app);
          }
        }
        if (button.dataset.action === 'continue-learning') goToCurrentLearning(app);
        if (button.dataset.action === 'checkin') {
          if (app.dataset.stats === 'checkin-pending') return;
          app.dataset.stats = 'checkin-pending';
          renderStats(app);
          window.setTimeout(() => {
            if (app.dataset.stats !== 'checkin-pending') return;
            app.dataset.stats = 'success';
            renderStats(app);
            announce(app, '今日学习记录已收好。');
            focusTarget(app, '.screen-stats [data-action="stats-next"]');
          }, 650);
        }
        if (button.dataset.action === 'purchase' || button.dataset.action === 'restore') {
          if (app.dataset.membershipOp !== 'idle') return;
          app.dataset.membershipOp = button.dataset.action;
          renderMembership(app);
          window.setTimeout(() => {
            if (app.dataset.membershipOp === 'idle') return;
            app.dataset.membershipOp = 'idle';
            app.dataset.membership = 'premium';
            renderMembership(app);
            announce(app, '会员权益已开放。');
            focusTarget(app, '.screen-profile .membership-stage');
          }, 650);
        }
        if (button.dataset.action === 'logout') {
          clearAuthInputs(app);
          setAuthState(app, 'phone-empty');
          showScreen(app, 'auth');
        }
        if (button.dataset.action === 'auth-secondary') {
          if (app.dataset.auth === 'hydration-error') {
            clearAuthInputs(app);
            setAuthState(app, 'phone-empty');
            announce(app, '已退出当前账号；请重新输入手机号。');
          } else {
            const digits = app.querySelector('.auth-phone').value.replace(/\D/g, '');
            setAuthState(app, digits.length === 11 ? (/^1[3-9]\d{9}$/.test(digits) ? 'phone-valid' : 'phone-invalid') : 'phone-empty');
            app.querySelector('.auth-phone').disabled = false;
            announce(app, '可以修改手机号。');
          }
          focusTarget(app, '.auth-phone');
        }
        if (button.dataset.action === 'auth-primary') {
          const mode = app.dataset.auth;
          if (mode === 'requesting' || mode === 'resending' || mode === 'resend-cooldown' || mode === 'verifying' || mode === 'hydrating') return;
          if (mode === 'phone-empty' || mode === 'phone-valid' || mode === 'request-error' || mode === 'request-network-error') {
            setAuthState(app, 'requesting');
            announce(app, '正在发送短码。');
            window.setTimeout(() => {
              if (app.dataset.auth !== 'requesting') return;
              setAuthState(app, 'code-requested');
              announce(app, '短码已发送，请输入短码。');
              focusTarget(app, '.auth-code');
            }, 650);
          } else if (mode === 'code-expired') {
            setAuthState(app, 'resending');
            announce(app, '正在重新发送短码。');
            window.setTimeout(() => {
              if (app.dataset.auth !== 'resending') return;
              setAuthState(app, 'resend-cooldown');
              announce(app, '短码已重新发送。');
              window.setTimeout(() => {
                if (app.dataset.auth !== 'resend-cooldown') return;
                setAuthState(app, 'code-requested');
                announce(app, '请输入新的短码。');
                focusTarget(app, '.auth-code');
              }, 650);
            }, 650);
          } else if (mode === 'code-requested' || mode === 'verify-error' || mode === 'verify-network-error') {
            setAuthState(app, 'verifying');
            announce(app, '正在验证短码。');
            window.setTimeout(() => {
              if (app.dataset.auth !== 'verifying') return;
              setAuthState(app, 'hydrating');
              announce(app, '登录成功，正在恢复学习进度。');
              window.setTimeout(() => {
                if (app.dataset.auth !== 'hydrating') return;
                setAuthState(app, 'ready');
                goToCurrentLearning(app);
              }, 650);
            }, 650);
          } else if (mode === 'hydration-error') {
            setAuthState(app, 'hydrating');
            announce(app, '正在重新恢复学习进度。');
            window.setTimeout(() => {
              if (app.dataset.auth !== 'hydrating') return;
              setAuthState(app, 'ready');
              goToCurrentLearning(app);
            }, 650);
          }
        }
        if (button.dataset.action === 'lock-submit') {
          const correct = app.dataset.lockSubject === lockAnswer.subject && app.dataset.lockVerb === lockAnswer.verb && app.dataset.lockObject === lockAnswer.object;
          app.dataset.lockResult = correct ? 'correct' : 'wrong';
          syncLock(app);
          announce(app, correct ? '主干已确认，可以继续下一张。' : '还有部分不正确，请修改后重试。');
          focusTarget(app, correct ? '.screen-lock .atlas-next' : '.screen-lock .lock-row[data-row-state="wrong"] select');
        }
        if (button.classList.contains('elimination-fragment')) {
          const picks = app.dataset.eliminationPicks ? app.dataset.eliminationPicks.split(',').filter(Boolean) : [];
          const key = button.dataset.fragment;
          const next = picks.includes(key) ? picks.filter(item => item !== key) : [...picks, key];
          app.dataset.eliminationPicks = next.sort().join(',');
          app.dataset.eliminationResult = 'idle';
          syncElimination(app);
        }
        if (button.dataset.action === 'elimination-submit') {
          const picks = app.dataset.eliminationPicks ? app.dataset.eliminationPicks.split(',').filter(Boolean).sort() : [];
          app.dataset.eliminationResult = picks.join(',') === eliminationAnswer.join(',') ? 'correct' : 'wrong';
          syncElimination(app);
          announce(app, app.dataset.eliminationResult === 'correct' ? '剥离正确，可以继续下一张。' : '还有部分需要调整，请修改后重试。');
          focusTarget(app, '.screen-elimination .atlas-next');
        }
        if (button.dataset.swipeChoice) {
          commitSwipe(app, button.dataset.swipeChoice);
        }
        if (button.dataset.action === 'atlas-next') {
          const next = button.dataset.nextScreen;
          if (next === 'learning') resetChoice(app, (Number(app.dataset.taskIndex || 0) + 1) % choiceDeck.length);
          else {
            if (next === 'swipe') {
              app.dataset.swipeResult = 'idle';
              app.dataset.swipePhase = 'idle';
            }
            showScreen(app, next);
          }
        }
        if (button.dataset.action === 'favorite') {
          beginFavoriteOperation(app, state.favoriteOp === 'error' ? state.favoriteTarget : state.favorite === 'on' ? 'off' : 'on');
        }
        if (button.dataset.action === 'sleep') {
          beginSleepOperation(app, 'sleep');
        }
        if (button.dataset.action === 'wake') {
          beginSleepOperation(app, 'wake');
        }
      });

      syncStates();
    })();
  </script>
</body>
</html>
