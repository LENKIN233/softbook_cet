<header><small>软书四六级</small><h1>轻快 · 卡片与空间</h1><p>题目、判断、关键原因与下一张。当前卡片属于一个可看见的位置，帮助在需要时展开。</p></header>

<figure><div class="phone reading"><div class="bar">软书四六级<small>我的</small></div><div class="address chapter"><strong><i class="dot"></i>阅读 / 定语</strong><span>4 / 5　☆</span></div><section class="paper"><div class="content"><h2>剥离干扰成分，保留句干</h2><div class="passage">The students <button class="removed" aria-pressed="true">who review in short bursts</button> <button class="removed" aria-pressed="true">usually</button> remember <button aria-pressed="false">the pattern</button> <button class="removed" aria-pressed="true">before the test</button>.</div><p class="muted" style="font-size:13px;margin-top:24px">轻点划掉的成分可恢复。</p><button class="tool">提示</button></div><div class="dock"><button class="primary">提交答案</button></div></section><nav class="nav"><span class="active">学习</span><span>空间</span><span>统计</span><span>我的</span></nav></div><figcaption>消除 · 原句保持完整，删除痕迹可撤销</figcaption></figure>
