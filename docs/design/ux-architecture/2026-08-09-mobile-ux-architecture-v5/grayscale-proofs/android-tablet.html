<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>软书四六级 · Android 平板</title>
  <link rel="stylesheet" href="./architecture.css?v=ux-architecture-v5-strict-4">
</head>
<body class="platform-android platform-android-tablet platform-tablet" data-audience="learner">
  <div class="app-frame tablet-frame android-tablet-frame platform-shell">
    <nav class="tablet-nav android-navigation-rail" aria-label="主要功能" data-main-nav hidden>
      <h1>软书四六级</h1>
      <button class="rail-button" type="button" data-route="learning">学习</button>
      <button class="rail-button" type="button" data-route="space">空间</button>
      <button class="rail-button" type="button" data-route="statistics">统计</button>
      <button class="rail-button" type="button" data-route="mine">我的</button>
    </nav>

    <div class="tablet-workspace android-content-window">
      <header class="top-bar android-tablet-top-bar">
        <button class="text-action" type="button" data-back hidden>返回</button>
        <div class="top-bar__title">
          <p class="top-bar__eyebrow" data-subtitle>登录</p>
          <h1 data-title>软书四六级</h1>
        </div>
        <span aria-hidden="true"></span>
      </header>
      <section class="tablet-content">
        <main data-view data-learner-surface></main>
        <aside class="context-pane" aria-label="当前内容的补充信息" data-context></aside>
      </section>
    </div>
  </div>

  <div data-sheet-root></div>
  <p class="live-region" role="status" aria-live="polite" aria-atomic="true" data-live></p>
  <script src="./architecture-flow.js?v=ux-architecture-v5-strict-4"></script>
</body>
</html>
