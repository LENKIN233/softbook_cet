appId: com.softbook.cet
name: ios-auth-screenshot
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: 'auth-phone-input'
    timeout: 30000
- assertVisible:
    id: 'standalone-auth-screen'
- assertNotVisible:
    id: 'route-tab-learning'
- assertNotVisible:
    id: 'route-tab-space'
- assertNotVisible:
    id: 'route-tab-statistics'
- assertNotVisible:
    id: 'route-tab-mine'
- assertVisible:
    id: 'auth-gate-keyboard-dismiss-target'
- assertVisible:
    id: 'auth-request-code-button'
