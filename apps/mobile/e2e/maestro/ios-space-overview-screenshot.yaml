appId: com.softbook.cet
name: ios-space-overview-screenshot
---
- clearState
- launchApp
- runFlow: first-run.yaml
- extendedWaitUntil:
    visible:
      id: "auth-phone-input"
    timeout: 30000
- tapOn:
    id: "auth-phone-input"
- inputText: "13800138000"
- tapOn:
    id: "auth-dismiss-keyboard-button"
- tapOn:
    id: "auth-request-code-button"
- assertVisible:
    id: "auth-code-input"
- tapOn:
    id: "auth-code-input"
- inputText: "2468"
- tapOn:
    id: "auth-gate-keyboard-dismiss-target"
- tapOn:
    id: "auth-submit-button"
- runFlow: study-home.yaml
- extendedWaitUntil:
    visible:
      id: first-learning-guide-start
    timeout: 30000
- tapOn:
    id: first-learning-guide-start
- tapOn:
    id: "route-tab-space"
- extendedWaitUntil:
    visible:
      id: "space-open-box-lid"
    timeout: 10000
- assertVisible:
    id: "space-sleep-alcove"
- assertVisible:
    id: "space-return-learning"
