appId: com.softbook.cet
name: ios-auth-statistics-gate-screenshot
---
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: 'authentication-entry-screen'
    timeout: 30000
- assertVisible:
    id: 'authentication-entry-card'
- assertVisible:
    id: 'auth-phone-input'
- assertVisible:
    id: 'auth-request-code-button'
- assertNotVisible:
    id: 'route-tab-learning'
- assertNotVisible:
    id: 'route-tab-space'
- assertNotVisible:
    id: 'route-tab-statistics'
- assertNotVisible:
    id: 'route-tab-mine'
