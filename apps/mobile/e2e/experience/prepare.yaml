appId: com.softbook.cet
name: prepare-reading-device
---
# Dedicated disposable device. Preparation has its own bounded budget.
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: 'auth-phone-input|route-tab-mine'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: route-tab-mine
    commands:
      - tapOn:
          id: route-tab-mine
      - tapOn:
          id: mine-account-logout-button
- assertVisible:
    id: auth-phone-input
- tapOn:
    id: auth-phone-input
- inputText: '13800000000'
- tapOn:
    id: auth-gate-keyboard-dismiss-target
- tapOn:
    id: auth-request-code-button
- tapOn:
    id: auth-code-input
- inputText: '2468'
- tapOn:
    id: auth-gate-keyboard-dismiss-target
- tapOn:
    id: auth-submit-button
- extendedWaitUntil:
    visible:
      id: learning-flip-button
    timeout: 60000
