appId: com.softbook.cet.experience
name: prepare-reading-device
---
# Dedicated disposable device. Preparation has its own bounded budget.
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: first-subject-cet4
    timeout: 60000
- tapOn:
    id: first-subject-cet4
- tapOn:
    id: first-subject-continue
- extendedWaitUntil:
    visible:
      id: local-start-learning-button
    timeout: 60000
- tapOn:
    id: local-start-learning-button
- extendedWaitUntil:
    visible:
      id: learning-home-start-button
    timeout: 60000
- assertVisible:
    id: learning-study-home
- assertNotVisible:
    id: learning-current-card
- tapOn:
    id: learning-home-start-button
- extendedWaitUntil:
    visible:
      id: first-learning-guide-start
    timeout: 60000
- tapOn:
    id: first-learning-guide-start
- extendedWaitUntil:
    visible:
      id: learning-option-1
    timeout: 60000
