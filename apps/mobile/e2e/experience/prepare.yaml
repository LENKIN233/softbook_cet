appId: com.softbook.cet.experience
name: prepare-reading-device
---
# Dedicated disposable device. Preparation has its own bounded budget.
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: local-start-learning-button
    timeout: 60000
- tapOn:
    id: local-start-learning-button
- extendedWaitUntil:
    visible:
      id: learning-option-1
    timeout: 60000
