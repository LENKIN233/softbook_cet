appId: com.softbook.cet
name: read-material-and-correction
---
# Dedicated development simulator only. No remote SMS or account is used.
- launchApp
- extendedWaitUntil:
    visible:
      id: learning-option-1
    timeout: 60000
- tapOn:
    id: learning-audio-control
    # Observe playback before a short clip ends; the default iOS settle wait
    # outlasted actual native playback in the captured CI failure.
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: learning-audio-state-playing
    timeout: 10000
- takeScreenshot: options
- tapOn:
    id: learning-option-2
- tapOn:
    id: learning-submit-button
- assertVisible:
    id: learning-correct-answer
- takeScreenshot: answer-first-layer
- scrollUntilVisible:
    element:
      id: learning-open-result-detail-button
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: learning-open-result-detail-button
    retryTapIfNoChange: true
- extendedWaitUntil:
    visible:
      id: learning-detail-action-dock
    timeout: 10000
- scrollUntilVisible:
    element:
      id: learning-detail-correct-answer
    direction: UP
    timeout: 10000
- takeScreenshot: answer
- scrollUntilVisible:
    element:
      id: learning-next-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-next-button
- extendedWaitUntil:
    visible:
      id: learning-current-card
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: material
- tapOn:
    id: learning-peek-button
- scrollUntilVisible:
    element:
      id: learning-support-layer
    direction: DOWN
    timeout: 10000
- assertVisible:
    id: learning-support-layer
- takeScreenshot: material-with-support
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: learning-option-1
      - tapOn:
          id: learning-submit-button
      - scrollUntilVisible:
          element:
            id: learning-open-result-detail-button
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: learning-open-result-detail-button
      - assertVisible:
          id: learning-result-detail-screen
      - takeScreenshot: android-detail-before-back
      - back
      - assertVisible:
          id: learning-current-card
      - assertNotVisible:
          id: learning-result-detail-screen
      - takeScreenshot: android-card-after-back
      - tapOn:
          id: route-tab-space
      - tapOn:
          id: space-open-card-list
      - assertVisible:
          id: space-browse-address-clue
      - back
      - assertVisible:
          id: space-open-card-list
      - takeScreenshot: android-space-after-back
      - back
      - assertVisible:
          id: learning-current-card
      - tapOn:
          id: route-tab-statistics
      - back
      - assertVisible:
          id: learning-current-card
      - tapOn:
          id: route-tab-mine
      - back
      - assertVisible:
          id: learning-current-card
