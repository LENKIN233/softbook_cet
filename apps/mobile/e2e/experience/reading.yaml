appId: com.softbook.cet
name: read-material-and-correction
---
# Dedicated development simulator only. No remote SMS or account is used.
- clearState
- launchApp
- extendedWaitUntil:
    visible:
      id: 'auth-phone-input|route-tab-mine'
    timeout: 60000
- runFlow:
    when:
      visible:
        id: route-tab-mine
    commands:
      - tapOn:
          id: route-tab-mine
      - tapOn:
          id: mine-account-logout-button
- assertVisible:
    id: auth-phone-input
- tapOn:
    id: auth-phone-input
- inputText: '13800000000'
- tapOn:
    id: auth-gate-keyboard-dismiss-target
- tapOn:
    id: auth-request-code-button
- tapOn:
    id: auth-code-input
- inputText: '2468'
- tapOn:
    id: auth-gate-keyboard-dismiss-target
- tapOn:
    id: auth-submit-button
- tapOn:
    id: learning-flip-button
- tapOn:
    id: learning-flip-confident-button
- tapOn:
    id: learning-next-button
- tapOn:
    id: learning-option-1
- tapOn:
    id: learning-submit-button
- tapOn:
    id: learning-open-result-detail-button
- takeScreenshot: answer
- tapOn:
    id: learning-next-button
- tapOn:
    id: learning-lock-1-1
- tapOn:
    id: learning-lock-2-3
- tapOn:
    id: learning-lock-3-2
- tapOn:
    id: learning-submit-button
- tapOn:
    id: learning-next-button
- takeScreenshot: material
- tapOn:
    id: learning-hint-button
- takeScreenshot: material-with-hint
