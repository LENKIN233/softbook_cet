appId: com.softbook.cet.experience
name: read-material-and-correction
---
# Dedicated development simulator only. No remote SMS or account is used.
# Preparation leaves this app on the selected card; relaunch would reopen the local start page.
- extendedWaitUntil:
    visible:
      id: learning-option-1
    timeout: 60000
- tapOn:
    id: learning-audio-control
- extendedWaitUntil:
    visible:
      id: learning-audio-state-playing
    timeout: 10000
- takeScreenshot: options
- tapOn:
    id: learning-option-${WRONG_OPTION_INDEX}
- tapOn:
    id: learning-submit-button
- assertVisible:
    id: learning-correct-answer
- takeScreenshot: answer-first-layer
- scrollUntilVisible:
    element:
      id: learning-open-result-detail-button
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: learning-open-result-detail-button
- extendedWaitUntil:
    visible:
      id: learning-result-detail-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: learning-detail-correct-answer
    direction: DOWN
    timeout: 10000
- takeScreenshot: answer
- scrollUntilVisible:
    element:
      id: learning-next-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-next-button
- extendedWaitUntil:
    visible:
      id: learning-current-card
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: material
- tapOn:
    id: learning-help-button
- scrollUntilVisible:
    element:
      id: learning-peek-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-peek-button
- assertVisible:
    id: learning-help-content
- scrollUntilVisible:
    element:
      id: learning-elimination-passage
    direction: UP
    timeout: 10000
- takeScreenshot: material-with-support
- tapOn:
    id: learning-elimination-4
- tapOn:
    id: learning-elimination-5
- takeScreenshot: material-with-correct-spans-marked
- tapOn:
    id: learning-elimination-4
- tapOn:
    id: learning-elimination-5
- tapOn:
    id: learning-elimination-1
- tapOn:
    id: learning-submit-button
- assertVisible:
    id: learning-correct-answer
- takeScreenshot: elimination-answer
- scrollUntilVisible:
    element:
      id: learning-open-result-detail-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-open-result-detail-button
- assertVisible:
    id: learning-result-detail-screen
- scrollUntilVisible:
    element:
      id: learning-detail-correct-answer
    direction: DOWN
    timeout: 10000
- takeScreenshot: elimination-detail
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: android-detail-before-back
      - back
      - assertVisible:
          id: learning-current-card
      - assertNotVisible:
          id: learning-result-detail-screen
      - takeScreenshot: android-card-after-back
      - tapOn:
          id: route-tab-space
      - tapOn:
          id: space-open-card-list
      - assertVisible:
          id: space-browse-address-clue
      - back
      - assertVisible:
          id: space-open-card-list
      - takeScreenshot: android-space-after-back
      - back
      - assertVisible:
          id: learning-current-card
      - tapOn:
          id: route-tab-statistics
      - back
      - assertVisible:
          id: learning-current-card
      - tapOn:
          id: route-tab-mine
      - back
      - assertVisible:
          id: learning-current-card
