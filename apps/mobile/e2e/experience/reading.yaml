appId: com.softbook.cet.experience
name: read-material-and-correction
---
# Dedicated development simulator only. Keep preparation and reading in one
# Maestro session so the iOS driver is not restarted between them.
- runFlow: prepare.yaml
- extendedWaitUntil:
    visible:
      id: learning-option-1
    timeout: 60000
# Scroll inside the reading region: screen-level visibility includes clipped
# descendants below this inner viewport, while the action dock stays fixed.
- swipe:
    start: 85%, 65%
    end: 85%, 40%
    duration: 400
- scrollUntilVisible:
    element:
      id: learning-help-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-help-button
- extendedWaitUntil:
    visible:
      id: learning-help-content
    timeout: 10000
- takeScreenshot: driver-help-open
# Scroll inside the reading region: screen-level visibility includes clipped
# descendants below this inner viewport, while the action dock stays fixed.
- swipe:
    start: 85%, 65%
    end: 85%, 40%
    duration: 400
- scrollUntilVisible:
    element:
      id: learning-help-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-help-button
- assertNotVisible:
    id: learning-help-content
- takeScreenshot: driver-help-closed
- scrollUntilVisible:
    element:
      id: learning-audio-control
    centerElement: true
    direction: UP
    timeout: 10000
- tapOn:
    id: learning-audio-control
    # Observe playback before a short clip ends; the default iOS settle wait
    # outlasted actual native playback in the captured CI failure.
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible:
      id: learning-audio-state-playing
    timeout: 10000
- takeScreenshot: options
- tapOn:
    id: learning-option-${WRONG_OPTION_INDEX}
- tapOn:
    id: learning-submit-button
- assertVisible:
    id: learning-correct-answer
- takeScreenshot: answer-first-layer
# Read to the bottom inside the paper before targeting its last control.
# iOS exposes off-clip descendants in the screen-level accessibility tree.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 85%, 65%
          end: 85%, 40%
          duration: 350
- scrollUntilVisible:
    element:
      id: learning-open-result-detail-button
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: learning-open-result-detail-button
- extendedWaitUntil:
    visible:
      id: learning-result-detail-screen
    timeout: 10000
- scrollUntilVisible:
    element:
      id: learning-detail-correct-answer
    direction: DOWN
    timeout: 10000
- takeScreenshot: answer
- scrollUntilVisible:
    element:
      id: learning-next-button
    direction: DOWN
    timeout: 10000
# Hosted iOS produced a visible, enabled button but did not deliver one tap.
# Retry only when the page did not change; the next material assertion catches
# both a missed advance and an accidental double advance.
- tapOn:
    id: learning-next-button
    enabled: true
    retryTapIfNoChange: true
    waitToSettleTimeoutMs: 1000
- extendedWaitUntil:
    visible:
      id: learning-current-card
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: material
# Scroll inside the reading region: screen-level visibility includes clipped
# descendants below this inner viewport, while the action dock stays fixed.
- swipe:
    start: 85%, 65%
    end: 85%, 40%
    duration: 400
- scrollUntilVisible:
    element:
      id: learning-help-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-help-button
- scrollUntilVisible:
    element:
      id: learning-peek-button
    direction: DOWN
    timeout: 10000
- tapOn:
    id: learning-peek-button
- assertVisible:
    id: learning-help-content
- scrollUntilVisible:
    element:
      id: learning-elimination-passage
    centerElement: true
    direction: UP
    timeout: 10000
- takeScreenshot: material-with-support
- tapOn:
    id: learning-elimination-4
- tapOn:
    id: learning-elimination-5
- takeScreenshot: material-with-correct-spans-marked
- tapOn:
    id: learning-elimination-4
- tapOn:
    id: learning-elimination-5
- tapOn:
    id: learning-elimination-1
- tapOn:
    id: learning-submit-button
- assertVisible:
    id: learning-correct-answer
- takeScreenshot: elimination-answer
# Read to the bottom inside the paper before targeting its last control.
# iOS exposes off-clip descendants in the screen-level accessibility tree.
- repeat:
    times: 3
    commands:
      - swipe:
          start: 85%, 65%
          end: 85%, 40%
          duration: 350
- scrollUntilVisible:
    element:
      id: learning-open-result-detail-button
    direction: DOWN
    centerElement: false
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: learning-open-result-detail-button
- assertVisible:
    id: learning-result-detail-screen
- scrollUntilVisible:
    element:
      id: learning-detail-correct-answer
    direction: DOWN
    timeout: 10000
- takeScreenshot: elimination-detail
- runFlow:
    when:
      platform: Android
    commands:
      - takeScreenshot: android-detail-before-back
      - back
      - assertVisible:
          id: learning-current-card
      - assertNotVisible:
          id: learning-result-detail-screen
      - takeScreenshot: android-card-after-back
      - tapOn:
          id: route-tab-space
      - tapOn:
          id: space-open-card-list
      - assertVisible:
          id: space-browse-address-clue
      - back
      - assertVisible:
          id: space-open-card-list
      - takeScreenshot: android-space-after-back
      - back
      - assertVisible:
          id: learning-current-card
      - tapOn:
          id: route-tab-statistics
      - back
      - assertVisible:
          id: learning-current-card
      - tapOn:
          id: route-tab-mine
      - back
      - assertVisible:
          id: learning-current-card
