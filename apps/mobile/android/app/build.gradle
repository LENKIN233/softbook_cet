apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // bundleConfig = file(../rn-cli.config.js)
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def releaseStoreFilePath = System.getenv('SOFTBOOK_ANDROID_RELEASE_STORE_FILE')
def releaseStorePassword = System.getenv('SOFTBOOK_ANDROID_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('SOFTBOOK_ANDROID_RELEASE_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SOFTBOOK_ANDROID_RELEASE_KEY_PASSWORD')
def releaseSigningValues = [
    releaseStoreFilePath,
    releaseStorePassword,
    releaseKeyAlias,
    releaseKeyPassword,
]
def configuredReleaseSigningValues = releaseSigningValues.count { value -> value != null && !value.isEmpty() }
def releaseSigningConfigured = configuredReleaseSigningValues == releaseSigningValues.size()
def requireSignedRelease = project.findProperty('softbookRequireSignedRelease') == 'true'
def requireUnsignedRelease = project.findProperty('softbookRequireUnsignedRelease') == 'true'
def configuredReleaseRuntimeProfile = project.findProperty('softbookReleaseRuntimeProfile') ?:
    System.getenv('SOFTBOOK_MOBILE_RELEASE_RUNTIME_PROFILE')
def repositoryFixtureRuntimeProfile = file("$rootDir/../e2e/fixtures/mobile-release-runtime-profile.repository-fixture.json")
def releaseRuntimeProfileFile = configuredReleaseRuntimeProfile ?
    file(configuredReleaseRuntimeProfile) :
    (requireUnsignedRelease ? repositoryFixtureRuntimeProfile : null)
def generatedReleaseRuntimeAssets = file("$buildDir/generated/softbook/releaseRuntimeProfile")

if (requireSignedRelease && requireUnsignedRelease) {
    throw new GradleException('Android release cannot require signed and unsigned modes together.')
}

if (configuredReleaseSigningValues > 0 && !releaseSigningConfigured) {
    throw new GradleException('Android release signing is partially configured.')
}
if (releaseSigningConfigured && !file(releaseStoreFilePath).isFile()) {
    throw new GradleException('Android release signing store file does not exist.')
}
if (requireSignedRelease && !releaseSigningConfigured) {
    throw new GradleException('Signed Android release requires complete receiver signing configuration.')
}
if (requireUnsignedRelease && releaseSigningConfigured) {
    throw new GradleException('Unsigned Android release rejects receiver signing configuration.')
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.softbook.cet"
    defaultConfig {
        applicationId "com.softbook.cet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (releaseSigningConfigured) {
            release {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }
    sourceSets {
        release {
            assets.srcDir generatedReleaseRuntimeAssets
        }
    }
}

def stageReleaseRuntimeProfile = tasks.register('stageReleaseRuntimeProfile', Exec) {
    def outputFile = file("$generatedReleaseRuntimeAssets/softbook-release-runtime-profile.json")
    outputs.file(outputFile)
    if (releaseRuntimeProfileFile != null) {
        inputs.file(releaseRuntimeProfileFile)
    }
    doFirst {
        if (releaseRuntimeProfileFile == null || !releaseRuntimeProfileFile.isFile()) {
            throw new GradleException(
                'Android Release requires -PsoftbookReleaseRuntimeProfile or SOFTBOOK_MOBILE_RELEASE_RUNTIME_PROFILE.'
            )
        }
        generatedReleaseRuntimeAssets.mkdirs()
        def command = [
            'node',
            file("$rootDir/../../../scripts/stage_mobile_release_runtime_profile.mjs").absolutePath,
            '--input', releaseRuntimeProfileFile.absolutePath,
            '--output', outputFile.absolutePath,
        ]
        if (requireUnsignedRelease && releaseRuntimeProfileFile == repositoryFixtureRuntimeProfile) {
            command.add('--allow-repository-fixture')
        }
        commandLine command
    }
}

tasks.configureEach { task ->
    if (task.name == 'preReleaseBuild') {
        task.dependsOn stageReleaseRuntimeProfile
    }
}

tasks.register('verifyReleaseSigningBoundary') {
    doLast {
        def configuredSigning = android.buildTypes.release.signingConfig
        if (configuredSigning != null && configuredSigning.name == 'debug') {
            throw new GradleException('Android release must never use the debug signing config.')
        }
        if (releaseSigningConfigured && configuredSigning?.name != 'release') {
            throw new GradleException('Configured Android release signing was not applied.')
        }
        if (requireSignedRelease && configuredSigning?.name != 'release') {
            throw new GradleException('Signed Android release did not apply receiver signing.')
        }
        if (requireUnsignedRelease && configuredSigning != null) {
            throw new GradleException('Unsigned Android release unexpectedly has a signing config.')
        }
        println releaseSigningConfigured
            ? 'Android release signing boundary: receiver signing configured.'
            : 'Android release signing boundary: unsigned CI artifact.'
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")
    implementation("androidx.media3:media3-exoplayer:1.10.1")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
